[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "findtools-voice"
version = "0.1.0"
description = "Independent device and server voice platform"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "numpy>=1.26,<3",
  "sounddevice>=0.5,<1",
  "vosk>=0.3.45,<0.4",
  "websockets>=15,<18",
  "pystray==0.19.5; sys_platform == 'win32'",
  "pycaw>=20260927,<20270000; sys_platform == 'win32'",
  "Pillow>=10,<14; sys_platform == 'win32'",
]

[project.scripts]
voice-platform = "voice_platform.__main__:main"

[tool.setuptools.packages.find]
include = ["voice_platform*"]

[tool.setuptools.package-data]
voice_platform = ["*.ps1", "admin_ui/*.html", "admin_ui/*.css", "admin_ui/*.js"]
